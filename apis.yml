name: Rylo
description: 'Rylo (Nagish Inc. d/b/a Rylo) is a New York-based accessibility technology
  company building free communication tools for people who are Deaf, hard of hearing,
  or have a speech disability. Its consumer mobile app provides FCC-certified real-time
  phone-call captioning, in-person Live Transcribe, and Sign features, with automatic
  language detection across 50+ languages. Rylo raised $85M and is backed by Accel
  and General Catalyst. The company operates a consumer application only and does not
  currently publish a public developer API, SDK, or webhook surface.'
